<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <!-- Stop pinch-zoom and double-tap zoom: little fingers trigger it by accident. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Noor Learning</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Every screen is drawn into #app by js/app.js. -->
  <main id="app" aria-live="polite"></main>
  <script type="module" src="js/app.js"></script>
  <script>
    // Makes the app installable ("Install app" / "Add to Home screen") and lets it run full screen.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
